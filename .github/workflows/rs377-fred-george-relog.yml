name: Fred and George relog safety source checks
on:
  pull_request:
    paths:
      - 'tools/rs377-bot-bench/engine-patch/src/engine/bot/FredGeorgeBot.ts'
      - 'tools/rs377-bot-bench/engine-patch/src/engine/bot/FredGeorgeBot.test.ts'
      - 'tools/rs377-bot-bench/tests/relog-source-contract.test.mjs'
      - '.github/workflows/rs377-fred-george-relog.yml'
  push:
    branches: [main]
    paths:
      - 'tools/rs377-bot-bench/engine-patch/src/engine/bot/FredGeorgeBot.ts'
      - 'tools/rs377-bot-bench/engine-patch/src/engine/bot/FredGeorgeBot.test.ts'
      - 'tools/rs377-bot-bench/tests/relog-source-contract.test.mjs'
      - '.github/workflows/rs377-fred-george-relog.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate bounded and safe relog source contracts
        run: node --test tools/rs377-bot-bench/tests/relog-source-contract.test.mjs
