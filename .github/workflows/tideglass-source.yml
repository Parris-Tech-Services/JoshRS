name: Tideglass source checks
on:
  push:
    paths:
      - 'expansions/archaeology-island/**'
      - '.github/workflows/tideglass-source.yml'
  pull_request:
    paths:
      - 'expansions/archaeology-island/**'
      - '.github/workflows/tideglass-source.yml'
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test original quest logic
        run: node --test expansions/archaeology-island/tests/gameplay.test.mjs
      - name: Validate manifest and asset references
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p='expansions/archaeology-island/';
          const m=JSON.parse(fs.readFileSync(p+'manifest.json','utf8'));
          assert.equal(m.tiles.rows.length, m.tiles.height);
          for (const row of m.tiles.rows) {
            assert.equal(row.length, m.tiles.width);
            for (const symbol of row) assert.ok(symbol in m.tiles.legend);
          }
          for (const obj of [...m.spawns, ...m.objects]) {
            const [x,y]=obj.cell;
            assert.ok(x>=0 && x<m.tiles.width && y>=0 && y<m.tiles.height);
          }
          for (const asset of m.assets) assert.ok(fs.existsSync(p+asset));
          "
      - name: Generate 64x64 JM2 and compare committed output
        run: |
          printf '0=cliff\n5=water\n9=road\n20=sandfloor\n28=grass\n' > /tmp/tideglass-flo.pack
          printf '0=m40_55\n1=l40_55\n' > /tmp/tideglass-map.pack
          node expansions/archaeology-island/tools/build-jm2.mjs 90 90 m90_90.jm2 /tmp/tideglass-flo.pack /tmp/tideglass-map.pack
          test "$(grep -Ec '^0 [0-9]+ [0-9]+: h0 u[0-9]+$' m90_90.jm2)" -eq 4096
          cmp m90_90.jm2 expansions/archaeology-island/generated/m90_90.jm2
      - name: Reject occupied map square
        run: |
          if node expansions/archaeology-island/tools/build-jm2.mjs 40 55 m40_55.jm2 /tmp/tideglass-flo.pack /tmp/tideglass-map.pack; then
            echo 'Expected collision rejection but generation succeeded.'
            exit 1
          fi
