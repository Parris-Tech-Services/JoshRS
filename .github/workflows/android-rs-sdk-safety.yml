name: Android RS-SDK sandbox safety

on:
  pull_request:
    paths:
      - 'tools/android-rs-sdk/**'
      - '.github/workflows/android-rs-sdk-safety.yml'
  push:
    branches: [main]
    paths:
      - 'tools/android-rs-sdk/**'
      - '.github/workflows/android-rs-sdk-safety.yml'
  workflow_dispatch:

jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n tools/android-rs-sdk/phone.sh
      - name: Offline safety tests
        run: python3 -m unittest discover -s tools/android-rs-sdk -p 'test_*.py' -v
