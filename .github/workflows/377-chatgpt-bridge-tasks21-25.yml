name: JoshRS 377 ChatGPT protocol and SDK bridge (source-only)
on:
  push:
    paths:
      - 'tools/rs377-chatgpt-bridge/**'
      - '.github/workflows/377-chatgpt-bridge-tasks21-25.yml'
  pull_request:
    paths:
      - 'tools/rs377-chatgpt-bridge/**'
      - '.github/workflows/377-chatgpt-bridge-tasks21-25.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact 377 bridge WebSocket dependency
        working-directory: tools/rs377-chatgpt-bridge
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run independent offline packet/login/observation tests
        working-directory: tools/rs377-chatgpt-bridge
        run: npm run check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Compile opt-in Fedora family quest runner (no account login)
        shell: bash
        run: |
          bun build tools/rs377-live-quest-bridge/run-fedora.mjs --target=bun --outfile="$RUNNER_TEMP/family-bot-quest-runner.js"
          node --check tools/rs377-live-quest-bridge/run-fedora.mjs
      - name: Checkout the exact upstream RS-SDK for real BotSDK class test
        uses: actions/checkout@v4
        with:
          repository: MaxBittker/rs-sdk
          ref: db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb
          path: rs-sdk-pinned
          persist-credentials: false
      - name: Install pinned RS-SDK test dependencies without executing scripts
        working-directory: rs-sdk-pinned
        run: bun install --ignore-scripts
      - name: Verify native Agy MCP source and single-bot scope
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/rs377-live-quest-bridge/mcp-private.mjs
          node --check tools/rs377-live-quest-bridge/mcp-session.mjs
          node --check tools/rs377-live-quest-bridge/mcp-server.mjs
          node --test tools/rs377-live-quest-bridge/mcp.test.mjs
      - name: Test actual original RS-SDK MCP stdio protocol (NO live game)
        shell: bash
        run: |
          set -euo pipefail
          pin=db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb
          mkdir -p "$HOME/.local/share/joshrs"
          test "$(git -C rs-sdk-pinned rev-parse HEAD)" = "$pin"
          cp -a rs-sdk-pinned "$HOME/.local/share/joshrs/rs-sdk-$pin"
          timeout --signal=TERM --kill-after=5s 45s bun tools/rs377-live-quest-bridge/mcp-protocol.acceptance.ts
      - name: Test actual upstream BotSDK class over authenticated 377-shaped WebSocket
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rs-sdk-pinned rev-parse HEAD)" = "db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb"
          timeout --signal=TERM --kill-after=5s 55s bun tools/rs377-chatgpt-bridge/test/upstream-botsdk.acceptance.ts "$GITHUB_WORKSPACE/rs-sdk-pinned"
      - name: Verify exact 39 upstream BotAction discriminants and non-fabricated coverage
        shell: bash
        run: |
          set -euo pipefail
          node tools/rs377-chatgpt-bridge/test/verify-upstream39.mjs rs-sdk-pinned/sdk/types.ts
      - name: Verify exact upstream pinned RS-SDK type contract Git blob
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 2 --max-time 30             https://raw.githubusercontent.com/MaxBittker/rs-sdk/db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb/sdk/types.ts -o "$tmp"
          actual="$(git hash-object "$tmp")"
          expected="ec59cef4f878c908481f68bd42cf698b68cdf579"
          test "$actual" = "$expected"
          grep -q 'export interface BotWorldState' "$tmp"
          grep -q 'export type BotAction' "$tmp"
          grep -q "type: 'walkTo'" "$tmp"
          grep -q "type: 'useItemOnLoc'" "$tmp"
          grep -q 'export interface ActionResult' "$tmp"
          echo "Pinned RS-SDK type blob and required action/state declarations matched"
