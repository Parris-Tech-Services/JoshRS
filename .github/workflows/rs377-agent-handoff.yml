name: RS377 agent checkpoint handoff validation
on:
  push:
    paths:
      - 'docs/rs377/CURRENT_AGENT_CHECKPOINT_HANDOFF.md'
      - 'tools/rs377-handoff/**'
      - '.github/workflows/rs377-agent-handoff.yml'
  pull_request:
    paths:
      - 'docs/rs377/CURRENT_AGENT_CHECKPOINT_HANDOFF.md'
      - 'tools/rs377-handoff/**'
      - '.github/workflows/rs377-agent-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-source-only-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checkpoint (does not access a game host)
        run: node tools/rs377-handoff/verify.mjs
      - name: Regression-test omissions and false live-success claims
        run: node --test tools/rs377-handoff/verify.test.mjs
