name: Fedora RS-SDK 377 quest campaign source checks
on:
  push:
    branches: [main, "feat/fedora-rssdk-quest-runner-20261109"]
    paths:
      - "tools/rs377-fedora-quests/**"
      - "tools/rs377-chatgpt-bridge/src/sdk-runtime.mjs"
      - "tools/rs377-bot-bench/engine-patch/src/web.ts"
      - ".github/workflows/fedora-rssdk-quests.yml"
      - "research/rs377/QUEST_QUEUE_2026-11-08.json"
  pull_request:
    paths:
      - "tools/rs377-fedora-quests/**"
      - "tools/rs377-chatgpt-bridge/src/sdk-runtime.mjs"
      - "tools/rs377-bot-bench/engine-patch/src/web.ts"
      - ".github/workflows/fedora-rssdk-quests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-safety-tests:
    name: Native Linux source and campaign regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Check scripts parse
        run: |
          bash -n tools/rs377-fedora-quests/setup-fedora.sh
          bash -n tools/rs377-fedora-quests/sandbox-fedora.sh
          node --check tools/rs377-fedora-quests/catalog.mjs
          node --check tools/rs377-fedora-quests/campaign.mjs
          node --check tools/rs377-fedora-quests/campaign.test.mjs
          node --check tools/rs377-chatgpt-bridge/src/sdk-runtime.mjs
      - name: Run exact 104 plus seven metadata/false-success tests
        run: node --test tools/rs377-fedora-quests/campaign.test.mjs
      - name: Compile and execute actual Bun campaign planner without a game login
        shell: bash
        run: |
          bun build tools/rs377-fedora-quests/run.ts --target=bun --outfile="$RUNNER_TEMP/quest-runner-bundle.js"
          bun tools/rs377-fedora-quests/run.ts --plan > "$RUNNER_TEMP/quest-plan.json"
          node -e "const a=require(process.argv[1]); if(a.total!==111||a.livePlayableVerified!==0||a.mode!=='READ_ONLY_SOURCE_PLAN') process.exit(1)" "$RUNNER_TEMP/quest-plan.json"
      - name: Verify no default game access
        run: |
          node -e "import('./tools/rs377-fedora-quests/catalog.mjs').then(m => {const c=m.readCatalogue(); if(c.questCount!==104||c.miniquestCount!==7) process.exit(1); console.log('104 quests, 7 miniquests, no account touched');})"
  actual-fedora-container:
    name: Fedora 44 container quest planner regression
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Run real Fedora OS source test container
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work fedora:44 bash -c '
            set -euo pipefail
            dnf install -y --setopt=install_weak_deps=False nodejs git >/dev/null
            node --version
            node --test tools/rs377-fedora-quests/campaign.test.mjs
            bash -n tools/rs377-fedora-quests/setup-fedora.sh
          bash -n tools/rs377-fedora-quests/sandbox-fedora.sh
          '
