name: JoshRS 377 isolated agent harness (source-only)
on:
  push:
    branches:
      - feature/rs377-rssdk-claude-harness-20261102
    paths:
      - 'tools/rs377-agent-harness/**'
      - '.github/workflows/377-agent-harness-isolated.yml'
  pull_request:
    paths:
      - 'tools/rs377-agent-harness/**'
      - '.github/workflows/377-agent-harness-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Fedora bootstrap and doctor mode (NO game or credentials)
        run: |
          bash -n tools/rs377-agent-harness/fedora/bootstrap.sh
          bash -n tools/rs377-agent-harness/fedora/setup.sh
          bash -n tools/rs377-agent-harness/fedora/test-bootstrap.sh
          bash tools/rs377-agent-harness/fedora/setup.sh --doctor
      - name: Verify Fedora separate worktree bootstraps offline and preserves changes
        run: bash tools/rs377-agent-harness/fedora/test-bootstrap.sh
      - name: Check isolated harness syntax and tests (NO game or credentials)
        run: npm run check --prefix tools/rs377-agent-harness
