name: Android Kotlin foundation

on:
  push:
    paths:
      - "android-client/**"
      - ".github/workflows/android-foundation.yml"
  pull_request:
    paths:
      - "android-client/**"
      - ".github/workflows/android-foundation.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build APK
        working-directory: android-client
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: joshrs-android-foundation-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
