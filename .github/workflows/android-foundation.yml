name: Android Kotlin foundation

on:
  push:
    paths:
      - "android-client/**"
      - "tools/android377-phone/**"
      - ".github/workflows/android-foundation.yml"
  pull_request:
    paths:
      - "android-client/**"
      - "tools/android377-phone/**"
      - ".github/workflows/android-foundation.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35 using runner SDK tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager_bin" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate isolated phone server installer syntax
        shell: bash
        run: |
          bash -n tools/android377-phone/install-phone-server.sh
          test "$(grep -c 'pin_repo "\$engine" b5ac859b47915afb545e60e4c1208f25d43cb3fb' tools/android377-phone/install-phone-server.sh)" = 1
          test "$(grep -c 'pin_repo "\$content" 44eab09081ef0f6c5f3eaabd1897a588ad7d9e50' tools/android377-phone/install-phone-server.sh)" = 1
          echo 'PHONE_SERVER_INSTALLER_SOURCE_CHECK_PASSED'
      - name: Test and build APK
        working-directory: android-client
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: joshrs-android-foundation-debug
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
