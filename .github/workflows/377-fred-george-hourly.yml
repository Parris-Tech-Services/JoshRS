name: Fred and George hourly AB charts

on:
  schedule:
    # Each hour after the last :00 ten-minute snapshot has been committed.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      utc_hour:
        description: "Optional completed UTC hour YYYY-MM-DDTHH (for backfill)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "tools/rs377-bot-bench/fred_george_hourly.py"
      - "tools/rs377-bot-bench/tests/test_fred_george_hourly.py"
      - ".github/workflows/377-fred-george-hourly.yml"

permissions:
  contents: write

concurrency:
  group: fred-george-hourly-publisher
  cancel-in-progress: false

jobs:
  hourly-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reporter without game or credentials
        run: python -m unittest discover -s tools/rs377-bot-bench/tests -v
      - name: Detect actual source snapshots
        id: detect
        shell: bash
        run: |
          if test -d reports/fred-george/snapshots && find reports/fred-george/snapshots -type f -name '*-Fred.json' -print -quit | grep -q .; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "No real Fred observations uploaded. Not generating fictional charts."
          fi
      - name: Generate the previous completed hour's observed reports
        if: steps.detect.outputs.has_data == 'true'
        shell: bash
        env:
          UTC_HOUR: ${{ inputs.utc_hour }}
        run: |
          if [ -n "$UTC_HOUR" ]; then
            [[ "$UTC_HOUR" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}$ ]] || exit 2
            python tools/rs377-bot-bench/fred_george_hourly.py --hour "$UTC_HOUR"
          else
            python tools/rs377-bot-bench/fred_george_hourly.py
          fi
      - name: Commit only sanitised hourly reports and charts
        if: steps.detect.outputs.has_data == 'true'
        shell: bash
        run: |
          git config user.name "joshrs-ab-reporter[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/fred-george/hourly/
          if git diff --cached --quiet; then
            echo "No new hourly report changes."
            exit 0
          fi
          git commit -m "report: real Fred and George hourly AB metrics and charts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Hourly report pushed. Live game and saves untouched."
