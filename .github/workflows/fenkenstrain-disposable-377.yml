name: Compile Fenkenstrain in disposable revision-377 world
on:
  pull_request:
    paths:
      - 'content-patches/rs377/**'
      - '.github/workflows/fenkenstrain-disposable-377.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fenkenstrain-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Checkout immutable upstream RS-SDK for native gameplay acceptance
        uses: actions/checkout@v4
        with:
          repository: MaxBittker/rs-sdk
          ref: db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb
          path: rs-sdk-pinned
          persist-credentials: false
      - name: Install verified upstream RS-SDK without lifecycle scripts
        shell: bash
        working-directory: rs-sdk-pinned
        run: |
          test "$(git rev-parse HEAD)" = 'db0cc51e0a8f9f0d6a7d60c44e534412bb0601bb'
          bun install --ignore-scripts
      - name: Clone immutable pinned 377 sources to disposable runner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joshrs-377-build"
          mkdir -p "$root"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Engine-TS.git "$root/engine"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Content.git "$root/content"
          for spec in 'engine b5ac859b47915afb545e60e4c1208f25d43cb3fb' 'content 44eab09081ef0f6c5f3eaabd1897a588ad7d9e50'; do
            read -r name pin <<< "$spec"
            actual="$(git -C "$root/$name" rev-parse HEAD)"
            if [ "$actual" != "$pin" ]; then
              git -C "$root/$name" fetch --depth 1 origin "$pin"
              git -C "$root/$name" checkout --detach "$pin"
            fi
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$pin"
          done
      - name: Overlay Fenkenstrain on disposable content only
        shell: bash
        run: bash content-patches/rs377/ci-compile-fenkenstrain.sh
      - name: Add isolated real-revision-377 observer to disposable engine only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joshrs-377-build/engine"
          cp tools/rs377-bot-bench/engine-patch/src/web.ts "$root/src/web.ts"
          python content-factory/patch_377_sdk_trace.py --engine "$root"
          test -s "$root/src/engine/observer/Native377Trace.ts"
      - name: Prepare pinned native RS-SDK transport for real client acceptance
        shell: bash
        run: npm --prefix tools/rs377-chatgpt-bridge install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Compile and pack actual 377 RuneScript
        shell: bash
        env:
          BUILD_SRC_DIR: ../content
          BUILD_VERIFY: 'true'
          BUILD_VERIFY_PACK: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/joshrs-377-build/engine"
          npm ci --no-audit --no-fund
          npm run build
          test -s data/pack/server/script.dat
          test -s data/pack/server/script.idx
          echo 'FENKENSTRAIN_NATIVE_COMPILE_PASSED'
      - name: Boot disposable compiled world (no family accounts or saves)
        shell: bash
        env:
          DB_BACKEND: sqlite
          NODE_PROFILE: joshrs_ci_377
          NODE_PORT: '15402'
          WEB_PORT: '18880'
          WEB_MANAGEMENT_PORT: '18881'
          BUILD_SRC_DIR: ../content
          RS377_LIVE_BOT_PROBE: 'true'
          RS377_PINNED_UPSTREAM: ${{ github.workspace }}/rs-sdk-pinned
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/joshrs-377-build/engine"
          npm run sqlite:migrate
          cd "$GITHUB_WORKSPACE"
          python content-factory/smoke_377.py --engine "$RUNNER_TEMP/joshrs-377-build/engine" --game-port 15402 --web-port 18880 --timeout 100
