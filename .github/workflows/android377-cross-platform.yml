name: Genuine 377 Android emulator and Windows integration
on:
  pull_request:
    paths:
      - "android-client/**"
      - "tools/android377-phone/**"
      - ".github/workflows/android377-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator-real377:
    name: Android emulator to real pinned 377 engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Clone verified pinned 377 server and content
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joshrs-batch-377"
          mkdir -p "$root"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Engine-TS.git "$root/engine"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Content.git "$root/content"
          for spec in 'engine b5ac859b47915afb545e60e4c1208f25d43cb3fb' 'content 44eab09081ef0f6c5f3eaabd1897a588ad7d9e50'; do
            read -r name pin <<< "$spec"
            if [[ "$(git -C "$root/$name" rev-parse HEAD)" != "$pin" ]]; then
              git -C "$root/$name" fetch --depth 1 origin "$pin"
              git -C "$root/$name" checkout --detach "$pin"
            fi
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$pin"
          done
      - name: Hard-disable public listeners and overlay actual JoshRS quest sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android377-phone/loopback_bind.py "$RUNNER_TEMP/joshrs-batch-377/engine"
          # This checkout may have CRLF patch text from actions/checkout.
          # Normalize only throwaway CI working-tree copies, not source blobs.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('content-patches/rs377/patches').glob('*.patch'):
              raw = p.read_bytes()
              if b'\r\n' in raw:
                  p.write_bytes(raw.replace(b'\r\n', b'\n'))
          PY
          bash content-patches/rs377/ci-compile-batch-quests.sh
          python3 tools/android377-phone/loopback_bind.py "$RUNNER_TEMP/joshrs-batch-377/engine" --verify
      - name: Build and migrate genuine revision-377 server
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/joshrs-batch-377/engine"
          npm ci --no-audit --no-fund
          BUILD_SRC_DIR=../content BUILD_VERIFY=true BUILD_VERIFY_PACK=true npm run build
          test -s data/pack/server/script.dat
          test -s data/pack/server/script.idx
          DB_BACKEND=sqlite NODE_PROFILE=joshrs_android_emulator_377 npm run sqlite:migrate
      - name: Enable host KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator against real 377 server
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android377-phone/run-emulator-real377.sh "$RUNNER_TEMP/joshrs-batch-377/engine"
      - name: Retain emulator screenshot and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-377-real-server-evidence
          path: reports/android377/
          if-no-files-found: warn
          retention-days: 14

  windows-real377:
    name: Actual Windows runner to real pinned 377 engine
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone and pin genuine Engine-TS and Content in disposable Windows folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          # Critical: Git for Windows defaults to CRLF checkout, which makes
          # the existing 377 unified diff patches fail on pack/*.pack files.
          git config --global core.autocrlf false
          git config --global core.eol lf
          $root = Join-Path $env:RUNNER_TEMP 'joshrs-batch-377'
          New-Item -Path $root -ItemType Directory -Force | Out-Null
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Engine-TS.git (Join-Path $root 'engine')
          if ($LASTEXITCODE -ne 0) { throw 'Engine clone failed' }
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Content.git (Join-Path $root 'content')
          if ($LASTEXITCODE -ne 0) { throw 'Content clone failed' }
          foreach ($spec in @(
            @('engine','b5ac859b47915afb545e60e4c1208f25d43cb3fb'),
            @('content','44eab09081ef0f6c5f3eaabd1897a588ad7d9e50')
          )) {
            $dir = Join-Path $root $spec[0]
            $head = (& git -C $dir rev-parse HEAD).Trim()
            if ($head -ne $spec[1]) {
              git -C $dir fetch --depth 1 origin $spec[1]
              if ($LASTEXITCODE -ne 0) { throw 'Pinned fetch failed' }
              git -C $dir checkout --detach $spec[1]
              if ($LASTEXITCODE -ne 0) { throw 'Pinned checkout failed' }
            }
            if ((& git -C $dir rev-parse HEAD).Trim() -ne $spec[1]) {
              throw "Pinned checkout mismatch for $($spec[0])"
            }
          }
          python tools/android377-phone/loopback_bind.py (Join-Path $root 'engine')
          if ($LASTEXITCODE -ne 0) { throw 'Unsafe Windows listener source' }
      - name: Overlay exactly the same real 377 quest sources under Git Bash
        shell: bash
        run: |
          set -euo pipefail
          export RUNNER_TEMP="$(cygpath -u "$RUNNER_TEMP")"
          export GITHUB_WORKSPACE="$(cygpath -u "$GITHUB_WORKSPACE")"
          # Windows Git checkout may convert content packs to CRLF. Convert
          # disposable source and patch copies to the pinned Linux LF form.
          python3 - "$RUNNER_TEMP/joshrs-batch-377/content" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          if not (root / 'scripts/general/scripts/quests.rs2').is_file():
              raise SystemExit('Cannot locate disposable Windows 377 content')
          count = 0
          for p in root.rglob('*'):
              if '.git' in p.relative_to(root).parts:
                  continue  # never read/write Git's binary .git/objects/*.pack
              if p.is_file() and p.suffix.lower() in {'.rs2', '.pack', '.varp', '.constant'}:
                  data = p.read_bytes()
                  if b'\r\n' in data:
                      p.write_bytes(data.replace(b'\r\n', b'\n'))
                      count += 1
          for p in Path('content-patches/rs377/patches').glob('*.patch'):
              data = p.read_bytes()
              if b'\r\n' in data:
                  p.write_bytes(data.replace(b'\r\n', b'\n'))
                  count += 1
          print('WINDOWS_DISPOSABLE_LF_CONVERSIONS', count)
          PY
          bash content-patches/rs377/ci-compile-batch-quests.sh
      - name: Compile, boot, and send real login-negotiation bytes on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'joshrs-batch-377'
          $engine = Join-Path $root 'engine'
          python tools/android377-phone/loopback_bind.py $engine --verify
          if ($LASTEXITCODE -ne 0) { throw 'Windows listener verification failed' }
          Push-Location $engine
          try {
            $env:BUILD_SRC_DIR = '../content'
            $env:BUILD_VERIFY = 'true'
            $env:BUILD_VERIFY_PACK = 'true'
            & npm.cmd ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Windows engine npm ci failed' }
            & npm.cmd run build
            if ($LASTEXITCODE -ne 0) { throw 'Windows engine content compile failed' }
            foreach ($f in @('data/pack/server/script.dat','data/pack/server/script.idx')) {
              if (!(Test-Path $f) -or (Get-Item $f).Length -le 2) {
                throw "Missing genuine 377 pack $f"
              }
            }
            $env:DB_BACKEND = 'sqlite'
            $env:NODE_PROFILE = 'joshrs_windows_android_test377'
            & npm.cmd run sqlite:migrate
            if ($LASTEXITCODE -ne 0) { throw 'Windows 377 SQLite migration failed' }
            $env:EASY_STARTUP = 'true'
            $env:NODE_PORT = '15402'
            $env:WEB_PORT = '18880'
            $env:WEB_MANAGEMENT_PORT = '18881'
            $env:LOGIN_SERVER = 'true'
            $env:FRIEND_SERVER = 'true'
            $env:LOGGER_SERVER = 'true'
            $env:WEBSITE_REGISTRATION = 'false'
            $env:NODE_DEBUG_SOCKET = 'false'
            $stdout = Join-Path $root 'windows-377-server.log'
            $stderr = Join-Path $root 'windows-377-server-errors.log'
            $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'npm.cmd run quickstart' -WorkingDirectory $engine -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              $ready = $false
              foreach ($i in 1..120) {
                if ($p.HasExited) { throw "377 server terminated unexpectedly: $($p.ExitCode)" }
                $ready = $true
                foreach ($port in @(15402,18880)) {
                  $socket = [System.Net.Sockets.TcpClient]::new()
                  try { $socket.Connect('127.0.0.1', $port) }
                  catch { $ready = $false }
                  finally { $socket.Dispose() }
                }
                if ($ready) { break }
                Start-Sleep -Seconds 1
              }
              if (-not $ready) { throw 'Windows pinned 377 engine did not expose both local ports' }
              $listeners = @(Get-NetTCPConnection -LocalPort 15402,18880 -State Listen)
              if ($listeners.Count -lt 2 -or @($listeners | Where-Object { $_.LocalAddress -ne '127.0.0.1' }).Count -gt 0) {
                throw 'Windows engine has missing or non-loopback listeners'
              }
              & (Join-Path $env:GITHUB_WORKSPACE 'tools/android377-phone/test-windows-377-connection.ps1') -GamePort 15402 -WebPort 18880
              if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Windows socket test failed' }
            } finally {
              if (-not $p.HasExited) { taskkill.exe /PID $p.Id /T /F | Out-Null }
            }
          } finally {
            Pop-Location
          }
