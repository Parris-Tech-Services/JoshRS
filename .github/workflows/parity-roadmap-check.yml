name: Validate parity research and roadmap

on:
  push:
    branches: [main]
    paths:
      - 'research/parity/roadmap/**'
      - 'docs/decisions/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/REFERENCE_VERSION_274.md'
      - 'docs/FULL_CLASSIC_MMO_CHECKLIST.md'
      - 'docs/JOSHRS_PROJECT_WIDE_MASTER_BACKLOG_2026-11-02.md'
      - 'docs/377_CONTENT_FACTORY.md'
      - 'research/parity/RESEARCH_FINDINGS_2026-11-08.md'
      - 'tools/parity-inventory/owner-decision.test.mjs'
      - 'tools/parity-inventory/validate-roadmap*.mjs'
      - '.github/workflows/parity-roadmap-check.yml'
  pull_request:
    paths:
      - 'research/parity/roadmap/**'
      - 'docs/decisions/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/REFERENCE_VERSION_274.md'
      - 'docs/FULL_CLASSIC_MMO_CHECKLIST.md'
      - 'docs/JOSHRS_PROJECT_WIDE_MASTER_BACKLOG_2026-11-02.md'
      - 'docs/377_CONTENT_FACTORY.md'
      - 'research/parity/RESEARCH_FINDINGS_2026-11-08.md'
      - 'tools/parity-inventory/owner-decision.test.mjs'
      - 'tools/parity-inventory/validate-roadmap*.mjs'
      - '.github/workflows/parity-roadmap-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-audit:
    name: Offline roadmap integrity and provenance status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Confirm Node version
        run: node --version
      - name: Validate backlog, DAG, CSV widths and honest status
        run: node tools/parity-inventory/validate-roadmap.mjs
      - name: Negative tests and current corpus regression
        run: node --test tools/parity-inventory/validate-roadmap.test.mjs
      - name: Protect exact-fidelity owner decision and legal-risk distinction
        run: node --test tools/parity-inventory/owner-decision.test.mjs
