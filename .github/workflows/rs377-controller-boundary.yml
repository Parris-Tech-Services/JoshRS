name: RS377 Controller Boundary
on:
  push:
    paths:
      - 'tools/rs377-controller-boundary/**'
      - '.github/workflows/rs377-controller-boundary.yml'
  pull_request:
    paths:
      - 'tools/rs377-controller-boundary/**'
      - '.github/workflows/rs377-controller-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and security regression tests (offline)
        working-directory: tools/rs377-controller-boundary
        run: npm run check
