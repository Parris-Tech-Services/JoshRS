name: JoshRS checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: docker compose -f deploy/local/compose.yaml config -q
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
        env:
          JOSHRS_URL: https://joshrs.vercel.app/
      - name: Save desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joshrs-browser-screenshots
          path: joshrs-*.png
          if-no-files-found: ignore
