name: JoshRS checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Verify isolated JoshRS 377 quest, gate and save safety modules
        run: |
          node --test \
            expansions/joshrs-quests/the-peace-shirt/install.test.mjs \
            expansions/joshrs-quests/the-peace-shirt/install-journal.test.mjs \
            tools/rs377-peace-shirt-tab/install.test.mjs \
            tools/rs377-burgh-gate/apply.test.mjs \
            tools/rs377-quest-playtest/scenario-policy.test.mjs \
            tools/rs377-saves/validate-family-world.test.mjs
      - run: docker compose -f deploy/local/compose.yaml config -q
  browser:
    # Playwright 1.57 cannot install Chromium on the new ubuntu-26.04 runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - name: Verify revision 377 map inspector on desktop and mobile
        run: node tests/map-inspector-browser.mjs
      - name: Exercise original-game town, saving and importing on desktop/mobile
        run: node tests/woodlands-local-browser.mjs
        env:
          JOSHRS_URL: https://joshrs.vercel.app/
      - name: Save desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joshrs-browser-screenshots
          path: joshrs-*.png
          if-no-files-found: ignore
