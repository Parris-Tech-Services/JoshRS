name: JoshRS 377 disposable Fedora launcher safety
on:
  push:
    branches: [main]
    paths:
      - 'tools/rs377-disposable/**'
      - '.github/workflows/rs377-disposable-launcher.yml'
  pull_request:
    paths:
      - 'tools/rs377-disposable/**'
      - '.github/workflows/rs377-disposable-launcher.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n tools/rs377-disposable/start-isolated-joshrs377.sh
          bash -n tools/rs377-disposable/recover-failed-loc-build.sh
          bash -n tools/rs377-disposable/test-recover.sh
          bash -n tools/rs377-disposable/fix-disposable-botplayer-import.sh
          bash -n tools/rs377-disposable/test-botplayer-import.sh
          bash -n tools/rs377-disposable/fix-disposable-world-botplayer-cycle.sh
          bash -n tools/rs377-disposable/test-world-botplayer-cycle.sh
      - name: Recover real-script failure fixture with scoped loc CRC exception
        run: bash tools/rs377-disposable/test-recover.sh
      - name: Repair early BotPlayer import in isolated fixture only
        run: bash tools/rs377-disposable/test-botplayer-import.sh
      - name: Repair actual World-BotPlayer-Player cyclic import without altering installed game
        run: bash tools/rs377-disposable/test-world-botplayer-cycle.sh
      - name: Launcher fails closed without manifest and never launches on import
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/rs377-disposable/start-isolated-joshrs377.sh
          if bash tools/rs377-disposable/start-isolated-joshrs377.sh prepare >/tmp/output 2>&1; then
            echo "Launcher should reject missing manifest"
            exit 1
          fi
          grep -q 'Usage:' /tmp/output
          grep -q 'node "$guard" --verify "$manifest"' tools/rs377-disposable/start-isolated-joshrs377.sh
          grep -q 'git clone --no-hardlinks' tools/rs377-disposable/start-isolated-joshrs377.sh
          grep -q 'build_parent="\$HOME/dev/JoshRS-disposable-worlds"' tools/rs377-disposable/start-isolated-joshrs377.sh
          if grep -q 'git clone --no-hardlinks .*"\$root/engine"' tools/rs377-disposable/start-isolated-joshrs377.sh; then
            echo "Refusing to build large engine source under RAM-backed /tmp"
            exit 1
          fi
          grep -q 'NODE_XPRATE=1' tools/rs377-disposable/start-isolated-joshrs377.sh
          grep -q 'NODE_PRODUCTION=false' tools/rs377-disposable/start-isolated-joshrs377.sh
          grep -q '127.0.0.1' tools/rs377-disposable/start-isolated-joshrs377.sh
          echo "Offline launcher safety gates passed; no game started"
