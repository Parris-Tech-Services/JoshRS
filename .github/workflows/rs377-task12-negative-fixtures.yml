name: RS377 Task 12 negative fixtures
on:
  push:
    branches: [task11-bootstrap-review]
  workflow_dispatch:
jobs:
  offline-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline bootstrap and negative fixtures
        run: bash tools/rs377-agent-harness/fedora/test-bootstrap.sh
