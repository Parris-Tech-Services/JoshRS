name: RS377 Task 12 fixture checks
on:
  push:
    branches:
      - task11-bootstrap-review
  workflow_dispatch:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline bootstrap and negative fixtures
        run: bash tools/rs377-agent-harness/fedora/test-bootstrap.sh
