name: JParris Desktop 377 Windows bootstrap

on:
  push:
    paths:
      - 'jparris-setup.cmd'
      - 'jparris-play.cmd'
      - 'JoshRS.cmd'
      - 'deploy/jparris-windows/**'
      - '.github/workflows/jparris-windows.yml'
  pull_request:
    paths:
      - 'jparris-setup.cmd'
      - 'jparris-play.cmd'
      - 'JoshRS.cmd'
      - 'deploy/jparris-windows/**'
      - '.github/workflows/jparris-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-static:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Windows scripts, source lock and entrypoints
        shell: powershell
        run: |
          $paths = @('deploy/jparris-windows/setup.ps1','deploy/jparris-windows/play.ps1','deploy/jparris-windows/test-bootstrap.ps1','deploy/jparris-windows/support.ps1','deploy/jparris-windows/control-center.ps1','deploy/jparris-windows/test-support.ps1','deploy/jparris-windows/discovery.ps1','deploy/jparris-windows/test-discovery.ps1','deploy/jparris-windows/launch-control-center.ps1','deploy/jparris-windows/test-recovery.ps1','deploy/jparris-windows/jdk.ps1','deploy/jparris-windows/test-jdk.ps1','deploy/jparris-windows/web-port.ps1','deploy/jparris-windows/test-web-port.ps1','deploy/jparris-windows/custom-loc-core.ps1','deploy/jparris-windows/fix-custom-loc.ps1','deploy/jparris-windows/test-custom-loc.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$path syntax errors: $($errors | Out-String)" }
          }
          $m = Get-Content 'deploy/jparris-windows/upstreams.json' -Raw | ConvertFrom-Json
          foreach ($source in @($m.engine,$m.content,$m.client)) {
            if ($source.commit -notmatch '^[0-9a-f]{40}$') { throw 'An upstream commit is not pinned to a SHA' }
            if ($source.url -notlike 'https://github.com/LostCityRS/*.git') { throw 'Unapproved upstream source URL' }
          }
          if (($m.gamePort - 43594) -ne $m.clientPortOffset) { throw 'Game port and Java port offset disagree' }
          if (($m.webPort - 80) -ne $m.clientPortOffset) { throw 'Web port and Java port offset disagree' }
          if (-not (Test-Path 'jparris-setup.cmd')) { throw 'Setup entrypoint missing' }
          if (-not (Test-Path 'jparris-play.cmd')) { throw 'Play entrypoint missing' }
          if (-not (Test-Path 'JoshRS.cmd')) { throw 'Native control-center entrypoint missing' }
          & '.\deploy\jparris-windows\setup.ps1' -CheckOnly

      - name: Exercise USB import and save preservation with synthetic files
        shell: powershell
        run: '& .\deploy\jparris-windows\test-bootstrap.ps1'
      - name: Validate offline backups and safe status report
        shell: powershell
        run: '& .\deploy\jparris-windows\test-support.ps1'
      - name: Test safe first-run removable-drive discovery
        shell: powershell
        run: '& .\deploy\jparris-windows\test-discovery.ps1'
      - name: Construct JoshRS native control center
        shell: powershell
        run: '& .\deploy\jparris-windows\control-center.ps1 -ValidateUi'
      - name: Verify Fedora USB HTTP port repair and untouched originals
        shell: powershell
        run: '& .\deploy\jparris-windows\test-web-port.ps1'
      - name: Test custom loc rebuild warning recovery without losing pack verification
        shell: powershell
        run: '& .\deploy\jparris-windows\test-custom-loc.ps1'
      - name: Verify dashboard launch recovery and rotating logs
        shell: powershell
        run: '& .\deploy\jparris-windows\test-recovery.ps1'
      - name: Verify standalone Windows GUI entrypoint
        shell: powershell
        run: '& .\deploy\jparris-windows\launch-control-center.ps1 -ValidateLauncher -NoDialog'

  windows-engine-client-build:
    needs: windows-static
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Java 21 overrides a stale JDK 17 configuration
        shell: powershell
        run: '& .\deploy\jparris-windows\test-jdk.ps1'
      - name: Fetch pinned revision 377, migrate SQLite and compile Java client
        shell: powershell
        run: |
          & '.\deploy\jparris-windows\setup.ps1' -SkipStart
      - name: Confirm expected local files
        shell: powershell
        run: |
          $state = Get-Content 'runtime/jparris-377/active.json' -Raw | ConvertFrom-Json
          if (-not (Test-Path (Join-Path $state.engine 'src/app.ts'))) { throw 'Engine missing' }
          if (-not (Test-Path (Join-Path $state.client 'build/classes/java/main/jagex2/client/Client.class'))) { throw 'Client class missing' }
          if ($state.portOffset -ne 8808) { throw 'Client port offset wrong' }
      - name: Start revision 377 game world and verify both local ports
        shell: powershell
        run: |
          $state = Get-Content 'runtime/jparris-377/active.json' -Raw | ConvertFrom-Json
          $log = Join-Path $env:RUNNER_TEMP 'joshrs-377-startup.log'
          $command = 'npm.cmd run quickstart > "' + $log + '" 2>&1'
          $process = Start-Process -FilePath 'cmd.exe' -ArgumentList @('/d','/c',$command) -WorkingDirectory $state.engine -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 120; $i++) {
              $game = Get-NetTCPConnection -State Listen -LocalPort ([int]$state.gamePort) -ErrorAction SilentlyContinue
              $web = Get-NetTCPConnection -State Listen -LocalPort ([int]$state.webPort) -ErrorAction SilentlyContinue
              if ($game -and $web) { $ready = $true; break }
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 5
            }
            if (-not $ready) { throw 'Revision 377 did not start its TCP and HTTP listeners in the test world.' }
            Write-Host "Verified game TCP $($state.gamePort) and HTTP $($state.webPort) in a disposable Windows test world."
          } finally {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }
