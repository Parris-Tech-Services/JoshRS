name: UFO2 Windows desktop-control disposable probe
on:
  push:
    branches: [main]
    paths:
      - "tools/rs377-ufo2/**"
      - ".github/workflows/ufo2-windows-disposable.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows-ufo2-desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone immutable Microsoft UFO2 Desktop AgentOS
        uses: actions/checkout@v4
        with:
          repository: microsoft/UFO
          ref: eae3c0a8d168c47cb10df0652e293e092eda1078
          path: microsoft-ufo
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimal official UFO2 UIA dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input pywinauto==0.6.8 uiautomation==2.0.18 psutil==5.9.8 Pillow==11.3.0 PyYAML==6.0.1 "pywin32>=310"
      - name: Probe Microsoft UFO2 UIA inspector against actual Notepad window
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\microsoft-ufo
        run: |
          python tools/rs377-ufo2/windows_probe.py
      - name: Preserve redacted UFO2 desktop capability evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ufo2-windows-desktop-disposable-evidence
          path: ${{ runner.temp }}\ufo2-windows-capability.json
          if-no-files-found: warn
          retention-days: 14
