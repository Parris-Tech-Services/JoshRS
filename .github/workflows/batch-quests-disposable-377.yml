name: Compile batch quests in disposable revision-377 world
on:
  pull_request:
    paths:
      - 'content-patches/rs377/**'
      - 'tools/android377-phone/**'
      - 'tools/rs377-quest-parity/**'
      - 'research/rs377/QUEST_QUEUE_2026-11-08.json'
      - '.github/workflows/batch-quests-disposable-377.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch-quests-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clone immutable pinned 377 sources to disposable runner
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/joshrs-batch-377"
          mkdir -p "$root"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Engine-TS.git "$root/engine"
          git clone --depth 1 --branch 377-wip https://github.com/LostCityRS/Content.git "$root/content"
          for spec in 'engine b5ac859b47915afb545e60e4c1208f25d43cb3fb' 'content 44eab09081ef0f6c5f3eaabd1897a588ad7d9e50'; do
            read -r name pin <<< "$spec"
            actual="$(git -C "$root/$name" rev-parse HEAD)"
            if [ "$actual" != "$pin" ]; then
              git -C "$root/$name" fetch --depth 1 origin "$pin"
              git -C "$root/$name" checkout --detach "$pin"
            fi
            test "$(git -C "$root/$name" rev-parse HEAD)" = "$pin"
          done
      - name: Verify Android phone loopback hardening against pinned real engine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/android377-phone/test_loopback_bind.py
          python3 tools/android377-phone/loopback_bind.py "$RUNNER_TEMP/joshrs-batch-377/engine"
          python3 tools/android377-phone/loopback_bind.py "$RUNNER_TEMP/joshrs-batch-377/engine" --verify
      - name: Overlay batch quests on disposable content only
        shell: bash
        run: bash content-patches/rs377/ci-compile-batch-quests.sh
      - name: Audit source-level evidence for every one of the 104 quests
        shell: bash
        run: |
          python3 -I tools/rs377-quest-parity/audit.py \
            --content "$RUNNER_TEMP/joshrs-batch-377/content" \
            --out-dir "$RUNNER_TEMP/quest-parity"
          cat "$RUNNER_TEMP/quest-parity/quests-104-evidence.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload 104-quest evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-104-source-accuracy-evidence
          path: ${{ runner.temp }}/quest-parity/
          if-no-files-found: warn
      - name: Compile and pack actual 377 RuneScript
        shell: bash
        env:
          BUILD_SRC_DIR: ../content
          BUILD_VERIFY: 'true'
          BUILD_VERIFY_PACK: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/joshrs-batch-377/engine"
          npm ci --no-audit --no-fund
          npm run build
          test -s data/pack/server/script.dat
          test -s data/pack/server/script.idx
          echo 'BATCH_QUESTS_NATIVE_COMPILE_PASSED'
      - name: Boot disposable compiled world (no family accounts or saves)
        shell: bash
        env:
          DB_BACKEND: sqlite
          NODE_PROFILE: joshrs_ci_377
          NODE_PORT: '15402'
          WEB_PORT: '18880'
          WEB_MANAGEMENT_PORT: '18881'
          BUILD_SRC_DIR: ../content
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/joshrs-batch-377/engine"
          npm run sqlite:migrate
          cd "$GITHUB_WORKSPACE"
          python content-factory/smoke_377.py --engine "$RUNNER_TEMP/joshrs-batch-377/engine" --game-port 15402 --web-port 18880 --timeout 100
