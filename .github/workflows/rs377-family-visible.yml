name: JoshRS rev377 same-world bot preflight
on:
  push:
    branches: [main, "fix/rs377-bot-tutorial-spawn-20261109"]
    paths:
      - "tools/rs377-family-visible/**"
      - ".github/workflows/rs377-family-visible.yml"
  pull_request:
    paths:
      - "tools/rs377-family-visible/**"
      - ".github/workflows/rs377-family-visible.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-client-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify syntax, private targets, authentic RSA, CRC and no default login
        run: |
          node --check tools/rs377-family-visible/join.mjs
          node --test tools/rs377-family-visible/join.test.mjs
      - name: Verify revision-377 saved-position and tutorial fix (synthetic fixtures only)
        run: |
          python3 -m py_compile tools/rs377-family-visible/prepare_lumbridge.py
          python3 -m unittest discover -s tools/rs377-family-visible -p 'test_prepare_lumbridge.py' -v
      - name: Read-only saved-position proof (synthetic fixture and fake process)
        run: |
          node --check tools/rs377-family-visible/verify-patrol.mjs
          node --test tools/rs377-family-visible/verify-patrol.test.mjs
      - name: Fedora wrapper cannot terminate caller or launch in CI
        shell: bash
        run: |
          bash -n tools/rs377-family-visible/run-fedora-patrol.sh
          set +e
          bash tools/rs377-family-visible/run-fedora-patrol.sh --check > /tmp/fedora-safe.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'PREFLIGHT_BLOCKED' /tmp/fedora-safe.log
          grep -q 'Terminal remains open' /tmp/fedora-safe.log
      - name: Agy live-377 handoff syntax and fail-closed offline smoke
        shell: bash
        run: |
          bash -n tools/rs377-family-visible/launch-agy-cook.sh
          set +e
          bash tools/rs377-family-visible/launch-agy-cook.sh --check >/tmp/agy-cook-safety.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'HANDOFF_BLOCKED' /tmp/agy-cook-safety.log
          ! grep -q 'AGY_HANDOFF_FINISHED' /tmp/agy-cook-safety.log
      - name: Simulate Agy handoff with private TTY and fake game (no live access)
        run: python3 -m unittest discover -s tools/rs377-family-visible -p 'test_launch_agy_cook.py' -v
      - name: Safe no-login help
        run: node tools/rs377-family-visible/join.mjs --help
