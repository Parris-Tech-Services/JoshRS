name: Fedora RS377 Java facing-target safety guard
on:
  push:
    paths:
      - "tools/rs377-fedora-client-doctor/**"
      - ".github/workflows/rs377-fedora-client-facing-guard.yml"
  pull_request:
    paths:
      - "tools/rs377-fedora-client-doctor/**"
      - ".github/workflows/rs377-fedora-client-facing-guard.yml"
  workflow_dispatch:
jobs:
  source-guard-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify patcher compiles
        run: python3 -m py_compile tools/rs377-fedora-client-doctor/guard_facing_indices.py
      - name: Offline patch safety tests
        run: python3 -m unittest -v tools/rs377-fedora-client-doctor/test_guard_facing_indices.py
