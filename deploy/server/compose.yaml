services:
  world:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - '127.0.0.1:8888:8888'
    environment:
      PORT: '8888'
      JOSHRS_ORIGIN: http://localhost:8888
      JOSHRS_DATA_DIR: /data
    volumes:
      - world-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8888/rs2.cgi').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 5m
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  world-data:
